<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#111"/>
    </marker>
    <marker id="arGrey" markerWidth="8" markerHeight="8" refX="6" refY="2.6" orient="auto">
      <path d="M0,0 L6,2.6 L0,5.2 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>

  <!-- ============ TITLES ============ -->
  <text x="70" y="62" font-size="27" font-weight="600" fill="#111">What I fix, what I release</text>
  <text x="70" y="90" font-size="15" fill="#666">Every project of Officine Gặp plotted on the two variables the practice actually turns.</text>
  <text x="70" y="112" font-size="15" fill="#666">Yuri Frassi · s4017499 · Milestone 2 · September 2026</text>

  <!-- ============ THE FAILURE BAND (drawn first, sits behind) ============ -->
  <path d="M 760 200 L 1180 200 L 1180 470 Z" fill="#d94f3d" opacity="0.07"/>
  <text x="1172" y="243" font-size="13.5" font-weight="600" fill="#c0392b" text-anchor="end">where the practice fails</text>
  <text x="1172" y="263" font-size="12.5" fill="#c0392b" text-anchor="end">long hold + high release =</text>
  <text x="1172" y="280" font-size="12.5" fill="#c0392b" text-anchor="end">editing, not hosting</text>

  <!-- ============ AXES ============ -->
  <line x1="200" y1="700" x2="1215" y2="700" stroke="#111" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="200" y1="700" x2="200" y2="180" stroke="#111" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- x axis -->
  <text x="708" y="775" font-size="16.5" font-weight="600" fill="#111" text-anchor="middle">HOW LONG THE FRAME MUST BE HELD</text>
  <text x="222" y="726" font-size="13" fill="#666">an evening</text>
  <text x="470" y="726" font-size="13" fill="#666">weeks</text>
  <text x="700" y="726" font-size="13" fill="#666">months</text>
  <text x="930" y="726" font-size="13" fill="#666">years</text>
  <text x="1160" y="726" font-size="13" fill="#666" text-anchor="middle">indefinitely</text>
  <line x1="470" y1="695" x2="470" y2="705" stroke="#bbb"/>
  <line x1="712" y1="695" x2="712" y2="705" stroke="#bbb"/>
  <line x1="945" y1="695" x2="945" y2="705" stroke="#bbb"/>
  <line x1="1160" y1="695" x2="1160" y2="705" stroke="#bbb"/>

  <!-- y axis -->
  <text x="0" y="0" font-size="16.5" font-weight="600" fill="#111" text-anchor="middle" transform="translate(112,440) rotate(-90)">HOW MUCH IS RELEASED</text>
  <text x="0" y="0" font-size="13" fill="#666" text-anchor="end" transform="translate(188,690)">nothing · we decide everything</text>
  <text x="0" y="0" font-size="13" fill="#666" text-anchor="end" transform="translate(188,470)">others make the content</text>
  <text x="0" y="0" font-size="13" fill="#666" text-anchor="end" transform="translate(188,300)">others make the content</text>
  <text x="0" y="0" font-size="13" fill="#666" text-anchor="end" transform="translate(188,318)">and set what comes next</text>
  <text x="0" y="0" font-size="13" fill="#666" text-anchor="end" transform="translate(188,205)">the frame itself is amendable</text>
  <line x1="195" y1="470" x2="205" y2="470" stroke="#bbb"/>
  <line x1="195" y1="300" x2="205" y2="300" stroke="#bbb"/>
  <line x1="195" y1="200" x2="205" y2="200" stroke="#bbb"/>

  <!-- ============ THE OTHER MODE — off-axis, separated ============ -->
  <rect x="252" y="800" width="470" height="66" rx="4" fill="#f2f2f2" stroke="#ccc" stroke-dasharray="4 3"/>
  <circle cx="286" cy="833" r="9" fill="#8a8a8a"/>
  <text x="308" y="828" font-size="14" font-weight="600" fill="#444">BIENNALE PRODUCTION · CAB26, BB25, IAB25 · 2024–26</text>
  <text x="308" y="848" font-size="12.5" fill="#777">Fixed term, nothing released. Off this chart entirely: a different community of practice.</text>

  <!-- ============ TRAJECTORY ARROW: CASC → SOUND MAP ============ -->
  <path d="M 372 636 C 560 620, 900 480, 1112 262" stroke="#9a9a9a" stroke-width="1.5"
        stroke-dasharray="6 5" fill="none" marker-end="url(#arGrey)"/>
  <text x="0" y="0" font-size="12.5" fill="#8a8a8a" font-style="italic" transform="translate(686,540) rotate(-25)">the same project, authorship moved out of the composition and into the frame</text>

  <!-- ============ PLOTTED PROJECTS ============ -->

  <!-- CASC dark room 2022 -->
  <circle cx="360" cy="642" r="12" fill="#111"/>
  <text x="382" y="638" font-size="14.5" font-weight="600" fill="#111">CRAFTING A SONIC CITY</text>
  <text x="382" y="656" font-size="12.5" fill="#777">2022 · dark room, two compositions, printed maps</text>
  <text x="382" y="673" font-size="12.5" fill="#777">We listened, selected, arranged. Visitors received.</text>

  <!-- CASC zine -->
  <circle cx="452" cy="556" r="10" fill="#111"/>
  <text x="472" y="553" font-size="13.5" font-weight="600" fill="#111">CASC ZINE — EN 2022, VN 2024</text>
  <text x="472" y="570" font-size="12.5" fill="#777">Two years apart. A credit drifted off the list.</text>

  <!-- The City Otherwise -->
  <circle cx="428" cy="452" r="10" fill="#111"/>
  <text x="448" y="449" font-size="13.5" font-weight="600" fill="#111">THE CITY OTHERWISE #1–3</text>
  <text x="448" y="466" font-size="12.5" fill="#777">2025 · short cycle, serial, revisable — it works</text>

  <!-- RN evening -->
  <circle cx="300" cy="288" r="14" fill="#1a7a4c"/>
  <text x="322" y="283" font-size="15" font-weight="600" fill="#1a7a4c">REINTERPRETING NARROWNESS</text>
  <text x="322" y="302" font-size="13" font-weight="600" fill="#1a7a4c">— the evening, 14 Oct 2022</text>
  <text x="322" y="320" font-size="12.5" fill="#777">One date, five studios, ~80 people. 5 → 25 practices.</text>
  <text x="322" y="337" font-size="12.5" fill="#1a7a4c" font-weight="600">They kept meeting without us. ✓ continuation</text>

  <!-- TUAR -->
  <circle cx="656" cy="326" r="12" fill="#1a7a4c"/>
  <text x="678" y="322" font-size="14.5" font-weight="600" fill="#1a7a4c">TUAR · TURTLE LAKE</text>
  <text x="678" y="340" font-size="12.5" fill="#777">2023 · 15 children, aged 4–5, ending in an exhibition</text>
  <text x="678" y="357" font-size="12.5" fill="#777">The only project where my frame was the only frame.</text>

  <!-- Gặp Series -->
  <circle cx="880" cy="252" r="12" fill="#c9861a"/>
  <text x="902" y="248" font-size="14.5" font-weight="600" fill="#b8791a">THE GẶP SERIES</text>
  <text x="902" y="266" font-size="12.5" fill="#777">2023– · each guest nominates the next</text>
  <text x="902" y="283" font-size="12.5" fill="#c9861a" font-weight="600">The release is checkable — but nothing is published.</text>

  <!-- Sound map -->
  <circle cx="1120" cy="250" r="14" fill="#c9861a"/>
  <text x="0" y="0" font-size="14.5" font-weight="600" fill="#b8791a" text-anchor="end" transform="translate(1098,224)">SAIGON_MIỀN TÂY SOUND MAP</text>
  <text x="0" y="0" font-size="12.5" fill="#777" text-anchor="end" transform="translate(1098,242)">2025– · 18 categories, open upload, unmoderated</text>
  <text x="0" y="0" font-size="12.5" fill="#c9861a" font-weight="600" text-anchor="end" transform="translate(1098,259)">No licence. No consent record. Held indefinitely by me.</text>

  <!-- RN book -->
  <circle cx="1005" cy="372" r="12" fill="#c0392b"/>
  <text x="0" y="0" font-size="14.5" font-weight="600" fill="#c0392b" text-anchor="end" transform="translate(983,352)">REINTERPRETING NARROWNESS — the book</text>
  <text x="0" y="0" font-size="12.5" fill="#777" text-anchor="end" transform="translate(983,370)">Proposed Sept 2023 · 23 projects, 3 essays, all confirmed</text>
  <text x="0" y="0" font-size="12.5" fill="#c0392b" font-weight="600" text-anchor="end" transform="translate(983,387)">Four years unpublished. Contributors dropped off by attrition.</text>

  <!-- ============ THE FINDING ============ -->
  <line x1="70" y1="806" x2="70" y2="878" stroke="#111" stroke-width="3"/>
  <rect x="760" y="796" width="570" height="76" fill="none"/>
  <text x="756" y="820" font-size="14.5" font-weight="600" fill="#111" text-anchor="start">The finding this diagram exists to make</text>
  <text x="756" y="842" font-size="13" fill="#444">Holding a frame for an evening is hosting. Holding one for four years is editing,</text>
  <text x="756" y="860" font-size="13" fill="#444">and editing means deciding on other people's behalf, repeatedly, in ways they can contest.</text>

  <!-- legend -->
  <circle cx="80" cy="822" r="7" fill="#1a7a4c"/>
  <text x="96" y="827" font-size="12.5" fill="#555">continued after I withdrew</text>
  <circle cx="80" cy="845" r="7" fill="#c9861a"/>
  <text x="96" y="850" font-size="12.5" fill="#555">open — terms still unwritten</text>
  <circle cx="80" cy="868" r="7" fill="#c0392b"/>
  <text x="96" y="873" font-size="12.5" fill="#555">stalled</text>

</svg>
